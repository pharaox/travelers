# The ck3-tiger.conf file is in standard Paradox script format.
# It should be placed in the top directory of your mod.

languages = {
	# This will check only english and german localizations
	#check = "english"
	#check = "german"

	# If you DON'T specify any check languages, you can instead say which ones to skip.
	#skip = "french"
	#skip = "spanish"

	# If you don't specify anything in languages, the validator will check all languages.
}

# Allows configuring what reports are printed by CK3-Tiger.
filter = {

    # Whether to report about problems in vanilla game files.
    # Setting this to 'yes' results in a LOT of spam.
    # Optional boolean value, defaults to no.
    show_vanilla = no

    # Whether to report about problems in mods loaded via the load_mod sections.
    # Optional boolean value, defaults to no.
    show_loaded_mods = no

    # Contains rules for reports, using trigger syntax.
    # Only reports matching the trigger will be printed.
    # The root trigger is an AND block, just like any other trigger.
    trigger = {
        # For more information, there is a guide at: ck3-tiger/filter.md

        # In short, valid trigger keys are:
        # - always = yes/no
        # - NOT, AND, OR, NAND, NOR
        # - severity
        # - confidence
        # - key
        # - file
        # - text
        # - ignore_keys_in_files

 		# Only print warnings and errors
		severity >= Warning
		# Don't print reports that are likely false positives
		confidence >= Reasonable

		# False positives
		NAND = { # Warnings for unknown prison types, these actually exist (tiger issue #350)
			key = missing-item
			text = "unknown prison type"
			OR = {
				file = common/customizable_localization/zzz_00_prison_custom_loc.txt
				file = common/scripted_effects/travl_travel_effects.txt
				file = common/scripted_triggers/travl_travel_triggers.txt
			}
		}
		NAND = { # Event backgrounds use scope:activity for activity events and fall back to the character's location otherwise, as in travel events (tiger issue #332)
			key = strict-scopes
			OR = {
				text = "`pam_church_event_background_is_grand_eastern_trigger` expects scope:activity to be set"
				text = "`pam_church_event_background_is_grand_western_trigger` expects scope:activity to be set"
				text = "`pam_church_event_background_is_grand_western_pre_gothic_trigger` expects scope:activity to be set"
			}
			file = common/event_backgrounds/01_event_backgrounds.txt
		}
		NAND = { # artifact_should_use_gfx_type_trigger guards scope:artifact with exists = scope:artifact.creator.culture, which tiger doesn't see as a guard (tiger issue #332)
			key = strict-scopes
			text = "`create_artifact_weapon_effect` expects scope:artifact to be set"
			file = common/on_action/travel_on_actions.txt
		}
		NAND = { # Warnings for this as killer in event effects, only used if $KILLER$ != this (tiger issue #280)
			key = use-of-this
			text = "target `this` makes no sense here"
			file = common/scripted_effects/travl_event_effects.txt
		}
		NAND = { # artifact creation effects guard scope:inspiration_sponsor with exists = scope:inspiration_sponsor.primary_title.var:..., which tiger doesn't see as a guard (tiger issue #332)
			key = strict-scopes
			text = "expects scope:inspiration_sponsor to be set"
		}

		# False positives due to tiger not updated to 1.21.0
		NAND = { # new triggers, effects, and links
			key = unknown-field
			OR = {
				text = "unknown token `is_ceremonial_liege`"
				text = "unknown token `is_trader`"
				text = "unknown token `prosperity_level`"
			}
		}
		NAND = { # scopes saved inside the new trade_market link or trade market lists
			key = strict-scopes
			OR = {
				text = "`merchant_market_familiarity_travel_effect` expects scope:market_familiarity_market to be set"
				text = "`merchant_souvenirs_aplenty_travel_effect` expects scope:merchant_keepsakes_market to be set"
				text = "`merchant_travel_logs_danger_xp_effect` expects scope:travel_logs_market to be set"
				text = "`surveyor_tutor_child_effect` expects scope:reading_the_market_trade_market to be set"
				text = "`voyager_gracious_host_impeccable_guest_effect` expects scope:polished_introductions_market to be set"
			}
		}

		# Ignored
		NAND = { # Warning for missing list none
			key = strict-scopes
			text = "expects list none to exist"
		}
		NAND = { # Vanilla issue: the earthquake in ep3_laamp_flavour_ewan_events uses prev inside location.county.holder, which is the traveler, not the county (to be fixed in Unop)
			key = scopes
			text = "`change_county_control` is for landed title but scope seems to be character"
			file = events/dlc/ep3/ep3_laamp_flavour_ewan_events.txt
		}
	}
}

# Use a load_mod section to tell ck3-tiger to load another mod before this one.
# This is useful when making submods or compatibility patch mods.
# You can have multiple load_mod sections.
#load_mod = {
#	# The label will be used in the error output to mark files from this mod
#	label = "FE"
#	# The path to the mod's .mod file. Use forward slashes.
#	modfile = "/home/gamer/Pdx/mod/FactionsExplained.mod"
#}

#characters = {
#	# Only warn about characters who are born by this date (usually your last bookmark)
#	only_born = "1511.1.1"  # optional
#}

# Sometimes ck3-tiger makes a mistake in determining the scope types expected
# by a scripted trigger or effect. Its conclusions can be overridden here.
# Scope overrides can be ALL (to accept any scope) or a list separated by |,
# like character|province|landed_title
scope_override = {
	artifact_low_rarity_trigger = ALL
	artifact_medium_rarity_trigger = ALL
	artifact_high_rarity_trigger = ALL
	artifact_region_trigger = ALL
}

# Optional block to control output styles and colors. Colors are enabled by default.
# Another way to disable all ANSI characters in the output is to supply the --no-color flag.
# That flag will override anything you define here, in the config file.
output_style = {
    # Default value is 'yes', except with ck3-tiger-auto when it is default 'no'.
    # If set to 'no', no ANSI characters will be added to the output and the output will not be colored.
    # Also, all other settings in this block will be ignored.
#    enable = yes

    # Optional block to set the error color.
